name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST) to prevent Supabase 7-day inactivity pause
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Request to Supabase Database
        run: |
          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL || 'https://qzpscvkindzakxeytpes.supabase.co' }}"
          SUPABASE_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_AwEmS6N5qVT5eMQePkiZFQ_xxa7nAeK' }}"

          echo "Pinging Supabase database to keep it active..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/listings?select=id&limit=1")

          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response:"
          cat response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase is active and heartbeat succeeded! Inactivity timer reset."
          else
            echo "⚠️ Unexpected HTTP response: $HTTP_STATUS"
            exit 1
          fi
